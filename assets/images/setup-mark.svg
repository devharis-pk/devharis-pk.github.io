<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="setupTitle setupDesc">
  <title id="setupTitle">General Setup poster</title>
  <desc id="setupDesc">Illustrated poster of users, roles, modules, and an audit trail. Not a screenshot of the product.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a35d6"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="ss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a1848" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sbg)"/>
  <circle cx="160" cy="140" r="160" fill="#fff" opacity="0.18"/>
  <circle cx="1120" cy="600" r="200" fill="#1b1324" opacity="0.08"/>
  <g filter="url(#ss)">
    <rect x="110" y="90" width="760" height="540" rx="36" fill="#fffdfb"/>
  </g>
  <text x="156" y="164" fill="#4c1d95" font-family="ui-monospace, monospace" font-size="16">USERS · GROUPS · ROLES</text>
  <text x="156" y="214" fill="#1b1324" font-family="Georgia, serif" font-size="42">Permissions</text>
  <g font-family="Georgia, serif" font-size="22" fill="#1b1324">
    <circle cx="190" cy="290" r="22" fill="#ffd0c4"/>
    <text x="230" y="298">User</text>
    <rect x="430" y="268" width="110" height="40" rx="20" fill="#efe7ff"/>
    <text x="456" y="295" fill="#4c1d95" font-size="18">Role</text>
    <rect x="556" y="268" width="130" height="40" rx="20" fill="#e7f7f3"/>
    <text x="578" y="295" fill="#0c8f7d" font-size="18">Module</text>
    <circle cx="190" cy="370" r="22" fill="#d2b8ff"/>
    <text x="230" y="378">Group</text>
    <rect x="430" y="348" width="140" height="40" rx="20" fill="#fff1ea"/>
    <text x="454" y="375" fill="#c43218" font-size="18">JWT</text>
    <rect x="586" y="348" width="180" height="40" rx="20" fill="#efe7ff"/>
    <text x="610" y="375" fill="#4c1d95" font-size="18">Tenant</text>
    <circle cx="190" cy="450" r="22" fill="#ffe3a3"/>
    <text x="230" y="458">Module</text>
    <rect x="430" y="428" width="200" height="40" rx="20" fill="#1b1324"/>
    <text x="458" y="455" fill="#fff7ef" font-size="18">Granular rights</text>
  </g>
  <g filter="url(#ss)">
    <rect x="910" y="160" width="250" height="400" rx="32" fill="#1b1324"/>
  </g>
  <text x="946" y="220" fill="#d2b8ff" font-family="ui-monospace, monospace" font-size="15">AUDIT</text>
  <text x="946" y="268" fill="#fff7ef" font-family="Georgia, serif" font-size="34">History</text>
  <g fill="#2a2133">
    <rect x="946" y="310" width="178" height="22" rx="11"/>
    <rect x="946" y="352" width="150" height="22" rx="11"/>
    <rect x="946" y="394" width="178" height="22" rx="11"/>
    <rect x="946" y="436" width="120" height="22" rx="11"/>
    <rect x="946" y="478" width="164" height="22" rx="11"/>
  </g>
</svg>

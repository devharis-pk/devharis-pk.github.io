<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="posTitle posDesc">
  <title id="posTitle">Restaurant POS poster</title>
  <desc id="posDesc">Illustrated poster of a receipt, a small-screen till, and a shift-close mark. Not a screenshot of the product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.48" stop-color="#ffc7b0"/>
      <stop offset="1" stop-color="#fff4ec"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfb"/>
      <stop offset="1" stop-color="#fff1ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#8a3418" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="180" fill="#fff" opacity="0.28"/>
  <circle cx="180" cy="620" r="140" fill="#ff4d2e" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="120" y="78" width="560" height="560" rx="36" fill="url(#panel)"/>
  </g>
  <text x="164" y="150" fill="#1b1324" font-family="Georgia, serif" font-size="42">Till receipt</text>
  <text x="164" y="188" fill="#8a5a4a" font-family="ui-monospace, monospace" font-size="16">INVOICE</text>
  <g fill="#f3e4dc">
    <rect x="164" y="230" width="300" height="18" rx="9"/>
    <rect x="164" y="278" width="250" height="18" rx="9"/>
    <rect x="164" y="326" width="280" height="18" rx="9"/>
    <rect x="164" y="374" width="220" height="18" rx="9"/>
  </g>
  <g fill="#ffd3c6">
    <rect x="520" y="230" width="108" height="18" rx="9"/>
    <rect x="540" y="278" width="88" height="18" rx="9"/>
    <rect x="500" y="326" width="128" height="18" rx="9"/>
    <rect x="548" y="374" width="80" height="18" rx="9"/>
  </g>
  <path d="M164 440 H636" stroke="#e7cfc4" stroke-width="3" stroke-dasharray="8 10"/>
  <rect x="164" y="470" width="472" height="92" rx="22" fill="#c43218"/>
  <text x="196" y="526" fill="#fff7ef" font-family="Georgia, serif" font-size="34">Bill math</text>
  <g filter="url(#shadow)">
    <rect x="760" y="150" width="390" height="430" rx="36" fill="#1b1324"/>
  </g>
  <text x="800" y="214" fill="#ffb4a6" font-family="ui-monospace, monospace" font-size="16">SMALL SCREEN</text>
  <text x="800" y="268" fill="#fff7ef" font-family="Georgia, serif" font-size="40">Shift close</text>
  <g>
    <rect x="800" y="310" width="310" height="54" rx="16" fill="#2a2133"/>
    <rect x="818" y="328" width="150" height="18" rx="9" fill="#ff8d74"/>
    <rect x="800" y="380" width="310" height="54" rx="16" fill="#2a2133"/>
    <rect x="818" y="398" width="190" height="18" rx="9" fill="#d2b8ff"/>
    <rect x="800" y="450" width="310" height="78" rx="18" fill="#0c8f7d"/>
    <text x="826" y="498" fill="#f3fffb" font-family="Georgia, serif" font-size="28">Drawer variance</text>
  </g>
</svg>
